name: IPA bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: IPA bauen
        run: ./bauen.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Spurwerk-ipa
          path: Spurwerk.ipa
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spurwerk Build ${{ github.run_number }}
          files: Spurwerk.ipa
          make_latest: true
