name: Spurwerk
options:
  bundleIdPrefix: de.mitkiprogrammieren
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Spurwerk:
    type: application
    platform: iOS
    sources: [Spurwerk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mitkiprogrammieren.spurwerk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Spurwerk/Info.plist
      properties:
        CFBundleDisplayName: Spurwerk
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Spurwerk zeichnet auf, welche Straßen du gefahren bist."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Mit „Immer“ startet Spurwerk die Aufnahme automatisch, sobald du Auto fährst – auch wenn die App geschlossen ist."
        NSMotionUsageDescription: "Spurwerk erkennt damit, ob du gerade Auto fährst oder zu Fuß gehst."
        NSLocalNetworkUsageDescription: "Spurwerk schickt deine Fahrten an den Kartendienst auf deinem NUC."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
