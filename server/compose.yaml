                      def eintrag(z):
                          e = {"id": z["id"], "status": z["status"], "fehler": z["fehler"], "spur": z["spur"], "geaendert": z["geaendert"]}
                          if z["quelle"] == "hand":   # von Hand nachgetragen – das iPhone kennt sie noch nicht
