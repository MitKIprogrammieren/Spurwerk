              k = bisect.bisect_right(vons, h["von"])
              for p in parken[max(0, k - 3):k]:
                  if (p["bis"] is None or p["bis"] >= h["bis"] - 60) and abstand((p["lat"], p["lon"]), (h["lat"], h["lon"])) <= 100:
                      return True
              return False
          return [h for h in halte if h["p"] or not doppelt(h)]


