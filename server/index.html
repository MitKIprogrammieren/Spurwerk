<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spurwerk</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--bg:#1b1d22;--panel:#26282d;--panel2:#2f3238;--ink:#f1efe8;--mute:#b4b2a9;--dim:#888780;--line:#3a3d44;
--auto:#1D9E75;--autoH:#5DCAA5;--fuss:#7F77DD;--fussH:#AFA9EC;--rad:#D85A30;--radH:#F0997B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--auto);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:6px;top:6px;width:14px;height:14px;border:3px solid #fff;border-width:0 0 3px 3px;transform:skewX(-20deg)}
.reiter{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.reiter button{padding:6px 16px;border-radius:999px;color:var(--mute)}
.reiter button.an{background:var(--ink);color:#111}
.zeit{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.chips{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.chips button{padding:5px 11px;border-radius:999px;color:var(--mute);font-size:13px}
.chips button.an{background:#E1F5EE;color:#085041}
.pfeil{width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:18px}
.pfeil:disabled{opacity:.35;cursor:default}
#zeitText{min-width:170px;text-align:center;font-weight:600}
main{position:absolute;top:var(--kopf,58px);left:0;right:0;bottom:0}
#karte{position:absolute;inset:0;background:var(--bg)}
.schwebe{position:absolute;z-index:500;background:rgba(38,40,45,.94);backdrop-filter:blur(8px);border-radius:18px;padding:10px 12px}
#artFilter{top:12px;left:12px;display:flex;gap:2px;padding:4px;border-radius:999px}
#artFilter button{padding:6px 12px;border-radius:999px;font-size:13px}
#artFilter button[data-art=""]{color:var(--ink)}#artFilter button[data-art=auto]{color:var(--autoH)}#artFilter button[data-art=fuss]{color:var(--fussH)}#artFilter button[data-art=rad]{color:var(--radH)}
#artFilter button.an{background:var(--ink);color:#111}
#summe{bottom:16px;left:12px;min-width:250px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kachel{border-radius:12px;padding:8px 10px}
.kachel small{display:block;font-size:12px}
.kachel b{font-size:19px}
.k-auto{background:#213a31}.k-auto small{color:var(--autoH)}
.k-fuss{background:#2d2b45}.k-fuss small{color:var(--fussH)}
.k-rad{background:#3d2720}.k-rad small{color:var(--radH)}
#stand{font-size:12px;color:var(--dim);margin-top:8px}
#liste{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
.listeInnen{max-width:820px;margin:0 auto}
.tag{color:var(--mute);font-size:13px;margin:18px 4px 6px;display:flex;justify-content:space-between}
.zeile{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border-radius:12px;margin-bottom:6px;cursor:pointer}
.zeile:hover{background:var(--panel2)}
.punkt{width:10px;height:10px;border-radius:50%;flex:none}
.zeile .t{flex:1;min-width:0}
.zeile .t small{color:var(--dim);display:block}
.marke{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.marke.w{color:#FAC775}.marke.f{color:#F09595}
.mehr{display:block;margin:14px auto;padding:10px 18px;border-radius:999px;background:var(--panel2)}
.leer{color:var(--dim);text-align:center;padding:40px 10px}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.55)!important;color:#aaa!important;font-size:11px}.maplibregl-ctrl-attrib a{color:#ccc!important}
#stilWahl{top:12px;right:56px;padding:4px;border-radius:999px;display:flex;gap:2px}
#stilWahl button{padding:6px 11px;border-radius:999px;font-size:13px;color:var(--mute)}
#stilWahl button.an{background:var(--ink);color:#111}
@media(max-width:700px){#stilWahl{top:auto;bottom:150px;right:8px;flex-direction:column}}
@media(max-width:700px){#zeitText{min-width:0;flex:1}.zeit{margin-left:0;width:100%}#summe{left:8px;right:8px;bottom:8px}}
</style>
</head>
<body>
<header id="kopf">
  <div class="logo"><i></i>Spurwerk</div>
  <div class="reiter"><button data-ansicht="karte" class="an">Karte</button><button data-ansicht="strecken">Strecken</button></div>
  <div class="zeit">
    <div class="chips" id="spanne">
      <button data-spanne="tag" class="an">Tag</button><button data-spanne="woche">Woche</button><button data-spanne="monat">Monat</button><button data-spanne="jahr">Jahr</button><button data-spanne="alles">Alles</button>
    </div>
    <button class="pfeil" id="zurueck" aria-label="Zurück">‹</button>
    <div id="zeitText">Heute</div>
    <button class="pfeil" id="vor" aria-label="Weiter">›</button>
  </div>
</header>
<main>
  <div id="karte"></div>
  <div class="schwebe" id="artFilter">
    <button data-art="" class="an">Alle</button><button data-art="auto">Auto</button><button data-art="fuss">Fuß</button><button data-art="rad">Rad</button>
  </div>
  <div class="schwebe" id="stilWahl">
    <button data-stil="spurwerk">Spurwerk</button><button data-stil="schwarz">Schwarz</button><button data-stil="hell">Hell</button><button data-stil="bunt">Bunt</button>
  </div>
  <div class="schwebe" id="summe"><div class="kacheln" id="kacheln"></div><div id="stand"></div></div>
  <div id="liste"><div class="listeInnen" id="listeInnen"></div></div>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
{
const $ = (id) => document.getElementById(id);
const FARBE = { auto: ["#1D9E75", "#5DCAA5"], fuss: ["#7F77DD", "#AFA9EC"], rad: ["#D85A30", "#F0997B"] };
const NAME = { auto: "Auto", fuss: "Zu Fuß", rad: "Fahrrad" };
const TOKEN = new URLSearchParams(location.search).get("token") || localStorage.getItem("sw-token") || "";
if (TOKEN) localStorage.setItem("sw-token", TOKEN);
const merk = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const sichere = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let ansicht = merk("sw-ansicht", "karte"), spanne = merk("sw-spanne", "tag"), art = merk("sw-art", ""), versatz = 0;
let gewaehlt = null, listeOffset = 0;

async function api(pfad) {
  const r = await fetch(pfad + (pfad.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const km = (m) => m < 1000 ? Math.round(m) + " m" : (m / 1000).toLocaleString("de-DE", { maximumFractionDigits: m < 100000 ? 1 : 0 }) + " km";
const dauer = (s) => { const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min"; };
const uhr = (t) => new Date(t * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

// ------------------------------------------------ Zeitraum
function zeitraum() {
  const h = new Date(); h.setHours(0, 0, 0, 0);
  let von, bis, text;
  if (spanne === "tag") {
    von = new Date(h); von.setDate(von.getDate() + versatz); bis = new Date(von); bis.setDate(bis.getDate() + 1);
    text = versatz === 0 ? "Heute" : versatz === -1 ? "Gestern" : von.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: von.getFullYear() !== h.getFullYear() ? "numeric" : undefined });
  } else if (spanne === "woche") {
    von = new Date(h); von.setDate(von.getDate() - ((von.getDay() + 6) % 7) + versatz * 7); bis = new Date(von); bis.setDate(bis.getDate() + 7);
    const e = new Date(bis); e.setDate(e.getDate() - 1);
    text = versatz === 0 ? "Diese Woche" : `${von.toLocaleDateString("de-DE", { day: "numeric", month: "short" })} – ${e.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" })}`;
  } else if (spanne === "monat") {
    von = new Date(h.getFullYear(), h.getMonth() + versatz, 1); bis = new Date(von.getFullYear(), von.getMonth() + 1, 1);
    text = von.toLocaleDateString("de-DE", { month: "long", year: "numeric" });
  } else if (spanne === "jahr") {
    von = new Date(h.getFullYear() + versatz, 0, 1); bis = new Date(von.getFullYear() + 1, 0, 1);
    text = String(von.getFullYear());
  } else { von = new Date(0); bis = new Date(4102444800000); text = "Alle Strecken"; }
  return { von: von.getTime() / 1000, bis: bis.getTime() / 1000, text };
}
const abfrage = () => { const z = zeitraum(); return `von=${z.von}&bis=${z.bis}&art=${art}`; };

// ------------------------------------------------ Karte
const OFM = "https://tiles.openfreemap.org";
const PALETTE = {
  spurwerk: { bg: "#131519", park: "#16201a", wasser: "#18222d", bau: "#1a1c21", klein: "#24272d", mittel: "#353941", gross: "#4a4f58", text: "#7c7f86", ort: "#5f636b" },
  schwarz:  { bg: "#090909", park: "#0f120f", wasser: "#171c20", bau: "#121212", klein: "#1b1b1b", mittel: "#2b2b2b", gross: "#3d3d3d", text: "#707070", ort: "#585858" },
};
const breite = (a, b) => ["interpolate", ["exponential", 1.5], ["zoom"], 10, a, 18, b];
const NAME_DE = ["coalesce", ["get", "name:de"], ["get", "name"]];
function eigenerStil(f) {
  return {
    version: 8, glyphs: OFM + "/fonts/{fontstack}/{range}.pbf",
    sources: { omt: { type: "vector", url: OFM + "/planet" } },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": f.bg } },
      { id: "gruen", type: "fill", source: "omt", "source-layer": "landcover", filter: ["in", ["get", "class"], ["literal", ["wood", "grass"]]], paint: { "fill-color": f.park, "fill-opacity": 0.7 } },
      { id: "park", type: "fill", source: "omt", "source-layer": "park", paint: { "fill-color": f.park } },
      { id: "wasser", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-color": f.wasser } },
      { id: "fluss", type: "line", source: "omt", "source-layer": "waterway", paint: { "line-color": f.wasser, "line-width": breite(0.5, 4) } },
      { id: "bau", type: "fill", source: "omt", "source-layer": "building", minzoom: 14, paint: { "fill-color": f.bau } },
      { id: "weg-klein", type: "line", source: "omt", "source-layer": "transportation", minzoom: 12,
        filter: ["in", ["get", "class"], ["literal", ["minor", "service", "path", "track", "pedestrian"]]],
        layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": f.klein, "line-width": breite(0.4, 6) } },
      { id: "weg-mittel", type: "line", source: "omt", "source-layer": "transportation",
        filter: ["in", ["get", "class"], ["literal", ["secondary", "tertiary"]]],
        layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": f.mittel, "line-width": breite(0.6, 10) } },
      { id: "weg-gross", type: "line", source: "omt", "source-layer": "transportation",
        filter: ["in", ["get", "class"], ["literal", ["motorway", "trunk", "primary"]]],
        layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": f.gross, "line-width": breite(0.8, 14) } },
      { id: "strassenname", type: "symbol", source: "omt", "source-layer": "transportation_name", minzoom: 14,
        layout: { "symbol-placement": "line", "text-field": NAME_DE, "text-font": ["Noto Sans Regular"], "text-size": 11 },
        paint: { "text-color": f.text, "text-halo-color": f.bg, "text-halo-width": 1.2 } },
      { id: "ort", type: "symbol", source: "omt", "source-layer": "place",
        filter: ["in", ["get", "class"], ["literal", ["city", "town", "suburb", "village", "quarter"]]],
        layout: { "text-field": NAME_DE, "text-font": ["Noto Sans Regular"], "text-transform": "uppercase", "text-letter-spacing": 0.08,
                  "text-size": ["match", ["get", "class"], "city", 15, "town", 13, 11] },
        paint: { "text-color": f.ort, "text-halo-color": f.bg, "text-halo-width": 1.5 } },
    ],
  };
}
const STILE = {
  spurwerk: () => eigenerStil(PALETTE.spurwerk),
  schwarz: () => eigenerStil(PALETTE.schwarz),
  hell: () => OFM + "/styles/positron",
  bunt: () => OFM + "/styles/liberty",
};
let stil = merk("sw-stil", "spurwerk"); if (!STILE[stil]) stil = "spurwerk";

const karte = new maplibregl.Map({ container: "karte", style: STILE[stil](), center: [13.48, 52.43], zoom: 11.5, attributionControl: false });
karte.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: '© <a href="https://openfreemap.org">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }));
karte.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

let daten = { type: "FeatureCollection", features: [] }, ladeNr = 0, grenzenAlt = null;
const FARB_AUSDRUCK = (i) => ["match", ["get", "a"], "fuss", FARBE.fuss[i], "rad", FARBE.rad[i], FARBE.auto[i]];

function spurenEinrichten() {
  if (!karte.getSource("spuren")) karte.addSource("spuren", { type: "geojson", data: daten });
  const fertig = ["==", ["get", "f"], 1];
  const schicht = (def) => { if (!karte.getLayer(def.id)) karte.addLayer(def); };
  schicht({ id: "schein", type: "line", source: "spuren", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": FARB_AUSDRUCK(0), "line-width": 11, "line-blur": 7,
             "line-opacity": ["case", fertig, ["case", ["==", ["get", "x"], 1], 0.18, 0.45], 0.15] } });
  schicht({ id: "kern", type: "line", source: "spuren", filter: fertig, layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": FARB_AUSDRUCK(1), "line-width": 3, "line-opacity": ["case", ["==", ["get", "x"], 1], 0.5, 0.95] } });
  schicht({ id: "roh", type: "line", source: "spuren", filter: ["!", fertig],
    paint: { "line-color": FARB_AUSDRUCK(1), "line-width": 2, "line-opacity": 0.6, "line-dasharray": [2, 2.5] } });
  schicht({ id: "gewaehlt", type: "line", source: "spuren", filter: ["==", ["get", "id"], gewaehlt || ""],
    layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": 5 } });
}
karte.on("style.load", spurenEinrichten);
for (const s of ["kern", "roh"]) {
  karte.on("click", s, (e) => waehle(e.features[0].properties.id));
  karte.on("mouseenter", s, () => (karte.getCanvas().style.cursor = "pointer"));
  karte.on("mouseleave", s, () => (karte.getCanvas().style.cursor = ""));
}

function dekodiere(s) {
  let i = 0, lat = 0, lon = 0; const out = [];
  while (i < s.length) {
    for (const k of [0, 1]) {
      let r = 0, sh = 0, b;
      do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const v = r & 1 ? ~(r >> 1) : r >> 1;
      if (k === 0) lat += v; else lon += v;
    }
    out.push([lon / 1e5, lat / 1e5]);
  }
  return out;
}

async function ladeKarte(zoomen) {
  const nr = ++ladeNr, grob = spanne === "jahr" || spanne === "alles";
  let d;
  try { d = await api(`/api/linien?${abfrage()}&grob=${grob ? 1 : 0}`); } catch (e) { $("stand").textContent = e.message; return; }
  if (nr !== ladeNr) return;
  const grenzen = new maplibregl.LngLatBounds();
  daten = { type: "FeatureCollection", features: [] };
  for (const l of d.linien) {
    const p = dekodiere(l.s); if (p.length < 2) continue;
    daten.features.push({ type: "Feature", properties: { id: l.id, a: l.a, f: l.f, x: l.x }, geometry: { type: "LineString", coordinates: p } });
    for (const q of p) grenzen.extend(q);
  }
  grenzenAlt = grenzen.isEmpty() ? null : grenzen;
  const quelle = karte.getSource("spuren");
  if (quelle) quelle.setData(daten);
  if (zoomen && grenzenAlt) karte.fitBounds(grenzenAlt, { padding: 60, maxZoom: 15, duration: 600 });
}

function waehle(id) {
  gewaehlt = gewaehlt === id ? null : id;
  if (karte.getLayer("gewaehlt")) karte.setFilter("gewaehlt", ["==", ["get", "id"], gewaehlt || ""]);
  const f = daten.features.find((x) => x.properties.id === gewaehlt);
  if (f) {
    const b = new maplibregl.LngLatBounds();
    for (const q of f.geometry.coordinates) b.extend(q);
    karte.fitBounds(b, { padding: 80, maxZoom: 16, duration: 600 });
  }
}

function zeigeStil() {
  document.querySelectorAll("[data-stil]").forEach((b) => b.classList.toggle("an", b.dataset.stil === stil));
}
document.querySelectorAll("[data-stil]").forEach((b) => b.onclick = () => {
  stil = b.dataset.stil; sichere("sw-stil", stil); zeigeStil();
  karte.setStyle(STILE[stil]());   // „style.load“ legt die Strecken wieder darüber
});
zeigeStil();

// ------------------------------------------------ Summen
async function ladeSummen() {
  try {
    const d = await api(`/api/summen?${abfrage()}`);
    const arten = ["auto", "fuss", "rad"].filter((a) => d[a] || a !== "rad");
    $("kacheln").innerHTML = arten.map((a) => `<div class="kachel k-${a}"><small>${NAME[a]}${d[a] ? " · " + d[a].anzahl : ""}</small><b>${km(d[a]?.meter || 0)}</b></div>`).join("");
  } catch (e) { $("kacheln").innerHTML = `<div class="leer">${esc(e.message)}</div>`; }
}
async function ladeStand() {
  try {
    const s = await api("/api/status"), z = s.zahlen, fertig = z.fertig || 0, offen = (z.wartet || 0) + (z.laeuft || 0);
    $("stand").textContent = s.gesamt ? (offen ? `Abgleich läuft: ${fertig.toLocaleString("de-DE")} von ${s.gesamt.toLocaleString("de-DE")} fertig` : `${s.gesamt.toLocaleString("de-DE")} Strecken, alle abgeglichen`) + (z.fehler ? ` · ${z.fehler} ohne Straße` : "") + (s.fehler ? " · " + s.fehler : "")
      : "Noch keine Strecken – die App lädt sie beim nächsten Öffnen hoch.";
  } catch (e) { $("stand").textContent = e.message; }
}

// ------------------------------------------------ Liste
async function ladeListe(neu) {
  if (neu) { listeOffset = 0; $("listeInnen").innerHTML = '<div class="leer">Lade …</div>'; }
  let d;
  try { d = await api(`/api/strecken?${abfrage()}&limit=150&offset=${listeOffset}`); } catch (e) { $("listeInnen").innerHTML = `<div class="leer">${esc(e.message)}</div>`; return; }
  if (neu) $("listeInnen").innerHTML = "";
  $("listeInnen").querySelector(".mehr")?.remove();
  let letzterTag = $("listeInnen").dataset.letzterTag || "";
  if (neu) letzterTag = "";
  const html = [];
  for (const s of d.strecken) {
    const t = new Date(s.start * 1000).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    if (t !== letzterTag) { html.push(`<div class="tag"><span>${t}</span></div>`); letzterTag = t; }
    const marke = s.status === "fertig" ? (s.geschaetzt ? '<span class="marke">geschätzt</span>' : "") : s.status === "fehler" ? '<span class="marke f">ohne Straße</span>' : '<span class="marke w">wartet</span>';
    html.push(`<div class="zeile" data-id="${esc(s.id)}"><span class="punkt" style="background:${(FARBE[s.art] || FARBE.auto)[1]}"></span><div class="t">${uhr(s.start)} – ${uhr(s.ende)} · ${NAME[s.art] || s.art}<small>${dauer(s.ende - s.start)}${s.quelle === "google" ? " · aus Google-Zeitachse" : ""}</small></div>${marke}<b>${km(s.distanz)}</b></div>`);
  }
  $("listeInnen").insertAdjacentHTML("beforeend", html.join("") || (neu ? '<div class="leer">Keine Strecken in diesem Zeitraum.</div>' : ""));
  $("listeInnen").dataset.letzterTag = letzterTag;
  listeOffset += d.strecken.length;
  if (d.strecken.length === 150) $("listeInnen").insertAdjacentHTML("beforeend", '<button class="mehr">Mehr laden</button>');
}
$("listeInnen").addEventListener("click", (ev) => {
  if (ev.target.closest(".mehr")) return ladeListe(false);
  const z = ev.target.closest(".zeile"); if (!z) return;
  zeigeAnsicht("karte"); gewaehlt = null;
  const id = z.dataset.id;
  setTimeout(() => waehle(id), 50);
});

// ------------------------------------------------ Bedienung
function zeigeAnsicht(a) {
  ansicht = a; sichere("sw-ansicht", a);
  document.querySelectorAll("[data-ansicht]").forEach((b) => b.classList.toggle("an", b.dataset.ansicht === a));
  const k = a === "karte";
  $("karte").style.display = $("artFilter").style.display = $("summe").style.display = $("stilWahl").style.display = k ? "" : "none";
  $("liste").style.display = k ? "none" : "block";
  if (k) setTimeout(() => karte.resize(), 0);
  else ladeListe(true);
}
function alles(zoomen = true) {
  const z = zeitraum();
  $("zeitText").textContent = z.text;
  $("vor").disabled = versatz >= 0 || spanne === "alles";
  $("zurueck").disabled = spanne === "alles";
  document.querySelectorAll("[data-spanne]").forEach((b) => b.classList.toggle("an", b.dataset.spanne === spanne));
  document.querySelectorAll("[data-art]").forEach((b) => b.classList.toggle("an", b.dataset.art === art));
  gewaehlt = null;
  if (karte.getLayer("gewaehlt")) karte.setFilter("gewaehlt", ["==", ["get", "id"], ""]);
  ladeKarte(zoomen); ladeSummen(); ladeStand();
  if (ansicht === "strecken") ladeListe(true);
}
document.querySelectorAll("[data-ansicht]").forEach((b) => b.onclick = () => zeigeAnsicht(b.dataset.ansicht));
document.querySelectorAll("[data-spanne]").forEach((b) => b.onclick = () => { spanne = b.dataset.spanne; versatz = 0; sichere("sw-spanne", spanne); alles(); });
document.querySelectorAll("[data-art]").forEach((b) => b.onclick = () => { art = b.dataset.art; sichere("sw-art", art); alles(false); });
$("zurueck").onclick = () => { versatz--; alles(); };
$("vor").onclick = () => { if (versatz < 0) { versatz++; alles(); } };
document.addEventListener("keydown", (ev) => { if (ev.key === "ArrowLeft") $("zurueck").click(); if (ev.key === "ArrowRight") $("vor").click(); });
const kopfHoehe = () => document.documentElement.style.setProperty("--kopf", $("kopf").offsetHeight + "px");
new ResizeObserver(kopfHoehe).observe($("kopf"));
setInterval(() => { ladeStand(); }, 15000);
zeigeAnsicht(ansicht);
alles();
}
</script>
</body>
</html>
